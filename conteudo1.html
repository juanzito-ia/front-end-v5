<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Conteúdo</title>
    <style>
        /* Reset básico para evitar conflitos */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { font-family: sans-serif; padding: 20px; background-color: #fff; }

        /* Container do Slide com altura forçada para teste */
        .show-container {
            width: 100%;
            max-width: 900px;
            height: 350px; /* Altura fixa para garantir visibilidade */
            margin: 0 auto 30px auto;
            position: relative;
            background-color: #333; /* Fundo escuro para ver se o bloco aparece */
            border-radius: 15px;
            overflow: hidden;
            display: block !important;
            visibility: visible !important;
        }

        .slide-item {
            display: none;
            width: 100%;
            height: 100%;
        }

        .slide-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Título dos vídeos */
        .secao-titulo {
            margin: 20px 0;
            padding-left: 10px;
            border-left: 5px solid #2ecc71;
            font-size: 24px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        iframe.video-player {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body>

    <h2 class="secao-titulo">Destaques</h2>
    
    <div class="show-container">
        <div class="slide-item" style="display: block;">
            <img src="https://picsum.photos/900/350?random=10">
        </div>
        <div class="slide-item">
            <img src="https://picsum.photos/900/350?random=20">
        </div>
        <div class="slide-item">
            <img src="https://picsum.photos/900/350?random=30">
        </div>
    </div>

    <h2 class="secao-titulo">Vídeos Educativos</h2>
    
    <div class="video-grid">
        <iframe class="video-player" src="https://www.youtube.com/embed/n_Etdr7Dbjs"></iframe>
        <iframe class="video-player" src="https://www.youtube.com/embed/UB1O30fR-EE"></iframe>
        <iframe class="video-player" src="https://www.youtube.com/embed/pQN-pnXPaVg"></iframe>
    </div>

    <script>
        let currentIdx = 0;
        const items = document.getElementsByClassName("slide-item");

        function startSlider() {
            // Esconde todos
            for (let i = 0; i < items.length; i++) {
                items[i].style.display = "none";
            }
            
            currentIdx++;
            if (currentIdx > items.length) { currentIdx = 1; }
            
            // Mostra o atual
            items[currentIdx - 1].style.display = "block";
            
            setTimeout(startSlider, 3000); // Troca a cada 3 segundos
        }

        // Inicia após carregar
        window.onload = startSlider;
    </script>
</body>
</html>
