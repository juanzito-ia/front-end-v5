<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background-color: transparent; 
        }

        .titulo-secao {
            margin: 20px 0 15px 0;
            padding-left: 10px;
            border-left: 5px solid #2ecc71;
            font-size: 22px;
            color: #333;
        }

        /* Container do Slideshow em Primeiro */
        .slider-container {
            width: 100%;
            max-width: 1000px;
            height: 400px;
            margin: 0 auto 30px auto;
            position: relative;
            background-color: #222;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .meu-slide {
            display: none;
            width: 100%;
            height: 100%;
        }

        .meu-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .legenda {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
        }

        /* Grid para os 6 vídeos embaixo */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

            <img src="https://picsum.photos/1000/400?random=10">
            <div class="legenda">Bem-vindo aos Destaques Semanais</div>
