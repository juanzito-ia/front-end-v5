<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: white; margin: 0; }
        
        .secao { margin-bottom: 40px; }
        h2 { border-left: 5px solid #2ecc71; padding-left: 10px; margin-bottom: 20px; }

        /* Slideshow Container */
        .slider {
            width: 100%; max-width: 800px; height: 350px;
            margin: 0 auto; position: relative; background: #333;
            border-radius: 10px; overflow: hidden;
        }

        .slide { display: none; width: 100%; height: 100%; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }

        /* Estilo das Setas */
        .seta {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -22px;
            color: white;
            font-weight: bold;
            font-size: 20px;
            transition: 0.3s ease;
            border-radius: 0 3px 3px 0;
            user-select: none;
            background-color: rgba(0,0,0,0.4);
            border: none;
            z-index: 10;
        }
        .seta:hover { background-color: rgba(0,0,0,0.8); }
        .seta-dir { right: 0; border-radius: 3px 0 0 3px; }
        .seta-esq { left: 0; }

        /* Grid de Vídeos */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-box { width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="secao">
        <h2>Destaques</h2>
        <div class="slider">
            <button class="seta seta-esq" onclick="mudarSlide(-1)">&#10094;</button>
            <button class="seta seta-dir" onclick="mudarSlide(1)">&#10095;</button>

            <div class="slide"><img src="https://picsum.photos/800/350?random=1"></div>
            <div class="slide"><img src="https://picsum.photos/800/350?random=2"></div>
            <div class="slide"><img src="https://picsum.photos/800/350?random=3"></div>
        </div>
    </div>

    <div class="secao">
        <h2>Vídeos Educativos</h2>
        <div class="grid">
            <div class="video-box"><iframe src="https://www.youtube.com/embed/n_Etdr7Dbjs"></iframe></div>
            <div class="video-box"><iframe src="https://www.youtube.com/embed/UB1O30fR-EE"></iframe></div>
            <div class="video-box"><iframe src="https://www.youtube.com/embed/pQN-pnXPaVg"></iframe></div>
            <div class="video-box"><iframe src="https://www.youtube.com/embed/S9uPNppGsGo"></iframe></div>
            <div class="video-box"><iframe src="https://www.youtube.com/embed/Ptbk2af68e8"></iframe></div>
            <div class="video-box"><iframe src="https://www.youtube.com/embed/mH0S_R-wD8I"></iframe></div>
        </div>
    </div>

    <script>
        let index = 1;
        let timer;
        const slides = document.querySelectorAll(".slide");

        // Inicializa o primeiro slide
        mostrarSlide(index);

        // Função para mudar o slide (botões)
        function mudarSlide(n) {
            clearTimeout(timer); // Para o tempo automático quando o usuário clica
            mostrarSlide(index += n);
        }

        function mostrarSlide(n) {
            if (n > slides.length) { index = 1 }
            if (n < 1) { index = slides.length }
            
            // Esconde todos
            slides.forEach(s => s.style.display = "none");
            
            // Mostra o atual
            slides[index-1].style.display = "block";
            
            // Reinicia a passagem automática (4 segundos)
            timer = setTimeout(() => {
                mostrarSlide(index += 1);
            }, 4000);
        }
    </script>
</body>
</html>
