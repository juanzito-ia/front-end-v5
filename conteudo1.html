<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: white; margin: 0; }
        
        .secao { margin-bottom: 40px; }
        h2 { border-left: 5px solid #2ecc71; padding-left: 10px; margin-bottom: 20px; }

        /* Slideshow */
        .slider {
            width: 100%; max-width: 800px; height: 300px;
            margin: 0 auto; position: relative; background: #333;
            border-radius: 10px; overflow: hidden;
        }
        .slide { display: none; width: 100%; height: 100%; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }

        /* Grid de Vídeos */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-box { width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="secao">
        <h2>Destaques</h2>
        <div class="slider">
            <div class="slide" style="display: block;"><img src="https://picsum.photos/800/300?random=1"></div>
            <div class="slide"><img src="https://picsum.photos/800/300?random=2"></div>
            <div class="slide"><img src="https://picsum.photos/800/300?random=3"></div>
        </div>
    </div>

    <div class="secao">
        <h2>Vídeos Educativos</h2>
        <div class="grid">
            <div class="video-box"><iframe src="https://www.youtube.com/embed/n_Etdr7Dbjs"></iframe></div>
            <div class="video-box"><iframe src="https://www.youtube.com/embed/UB1O30fR-EE"></iframe></div>
            <div class="video-box"><iframe src="https://www.youtube.com/embed/pQN-pnXPaVg"></iframe></div>
            <div class="video-box"><iframe src="https://www.youtube.com/embed/S9uPNppGsGo"></iframe></div>
            <div class="video-box"><iframe src="https://www.youtube.com/embed/Ptbk2af68e8"></iframe></div>
            <div class="video-box"><iframe src="https://www.youtube.com/embed/mH0S_R-wD8I"></iframe></div>
        </div>
    </div>

    <script>
        let index = 0;
        const slides = document.querySelectorAll(".slide");
        function show() {
            slides.forEach(s => s.style.display = "none");
            index++;
            if (index > slides.length) index = 1;
            slides[index-1].style.display = "block";
            setTimeout(show, 3000);
        }
        show();
    </script>
</body>
</html>
