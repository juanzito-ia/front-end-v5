<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f4; }
        
        /* Garante que o container seja visível */
        .slideshow-container {
            width: 100%;
            max-width: 800px;
            height: 300px;
            margin: 0 auto 30px;
            position: relative;
            background: #ccc; /* Cor de fundo caso a imagem falhe */
            border-radius: 10px;
            overflow: hidden;
            display: block !important; /* Força a exibição */
        }

        .mySlides { display: none; width: 100%; height: 100%; }
        
        img { width: 100%; height: 100%; object-fit: cover; }

        .active-slide { display: block; }

        .grid-videos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        iframe { width: 100%; aspect-ratio: 16/9; border-radius: 8px; border: none; }
    </style>
</head>
<body>

    <h2>Destaques</h2>
    <div class="slideshow-container">
        <div class="mySlides active-slide">
            <img src="https://picsum.photos/800/300?sig=1">
        </div>
        <div class="mySlides">
            <img src="https://picsum.photos/800/300?sig=2">
        </div>
        <div class="mySlides">
            <img src="https://picsum.photos/800/300?sig=3">
        </div>
    </div>

    <h2>Vídeos</h2>
    <div class="grid-videos">
        <iframe src="https://www.youtube.com/embed/n_Etdr7Dbjs"></iframe>
        <iframe src="https://www.youtube.com/embed/UB1O30fR-EE"></iframe>
    </div>

    <script>
        let slideIdx = 0;
        const slides = document.getElementsByClassName("mySlides");

        function rotate() {
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            slideIdx++;
            if (slideIdx > slides.length) { slideIdx = 1; }
            slides[slideIdx - 1].style.display = "block";
            setTimeout(rotate, 3000);
        }
        rotate();
    </script>
</body>
</html>
