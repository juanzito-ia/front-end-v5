<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background-color: white !important;
            min-height: 1500px; /* Força o corpo da página a ser comprido */
        }

        .titulo-secao {
            margin: 30px 0 15px 0;
            padding-left: 10px;
            border-left: 5px solid #2ecc71;
            font-size: 22px;
            display: block !important;
        }

        /* Container do Slideshow no Topo */
        .slider-box {
            width: 100%;
            max-width: 900px;
            height: 350px;
            margin: 0 auto 40px auto;
            position: relative;
            background-color: #333;
            border-radius: 15px;
            overflow: hidden;
            display: block !important;
        }

        .item-slide {
            display: none;
            width: 100%;
            height: 100%;
        }

        .item-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Grid de Vídeos - Forçando exibição */
        .area-videos {
            display: grid !important;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            margin-top: 20px;
            padding-bottom: 50px;
        }

        .video-card {
            width: 100%;
            aspect-ratio: 16/9;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h2 class="titulo-secao">Destaques</h2>
    <div class="slider-box">
        <div class="item-slide" style="display: block;">
            <img src="https://picsum.photos/900/350?random=1">
        </div>
        <div class="item-slide">
            <img src="https://picsum.photos/900/350?random=2">
        </div>
        <div class="item-slide">
            <img src="https://picsum.photos/900/350?random=3">
        </div>
    </div>

    <h2 class="titulo-secao">Galeria de Vídeos (6 vídeos)</h2>
    <div class="area-videos">
        <div class="video-card"><iframe src="https://www.youtube.com/embed/n_Etdr7Dbjs"></iframe></div>
        <div class="video-card"><iframe src="https://www.youtube.com/embed/UB1O30fR-EE"></iframe></div>
        <div class="video-card"><iframe src="https://www.youtube.com/embed/pQN-pnXPaVg"></iframe></div>
        <div class="video-card"><iframe src="https://www.youtube.com/embed/S9uPNppGsGo"></iframe></div>
        <div class="video-card"><iframe src="https://www.youtube.com/embed/Ptbk2af68e8"></iframe></div>
        <div class="video-card"><iframe src="https://www.youtube.com/embed/mH0S_R-wD8I"></iframe></div>
    </div>

    <script>
        let slidePos = 0;
        const slides = document.getElementsByClassName("item-slide");

        function rodarSlider() {
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            slidePos++;
            if (slidePos > slides.length) { slidePos = 1; }
            slides[slidePos - 1].style.display = "block";
            setTimeout(rodarSlider, 3000);
        }
        rodarSlider();
    </script>
</body>
</html>
