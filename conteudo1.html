<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Juan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { padding: 20px; background: #f4f4f4; }
        
        .secao { margin-bottom: 40px; max-width: 1000px; margin-left: auto; margin-right: auto; }
        h2 { border-left: 5px solid #2ecc71; padding-left: 10px; margin-bottom: 20px; color: #333; }

        /* Slideshow Container */
        .slider-container {
            width: 100%;
            height: 400px;
            position: relative;
            background: #333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .slide { display: none; width: 100%; height: 100%; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }

        /* Estilo das Setas (Botoes Passaveis) */
        .seta {
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: 0.3s;
            z-index: 100; /* Garante que fiquem acima das imagens */
            user-select: none;
        }

        .seta:hover { background-color: #2ecc71; }
        .seta-esq { left: 15px; }
        .seta-dir { right: 15px; }

        /* Grid de Vídeos */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-box { width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="secao">
        <h2>Destaques</h2>
        <div class="slider-container">
            <button class="seta seta-esq" onclick="mudarSlide(-1)">&#10094;</button>
            <button class="seta seta-dir" onclick="mudarSlide(1)">&#10095;</button>

            <div class="slide"><img src="https://picsum.photos/800/400?random=1"></div>
            <div class="slide"><img src="https://picsum.photos/800/400?random=2"></div>
            <div class="slide"><img src="https://picsum.photos/800/400?random=3"></div>
        </div>
    </div>

    <div class="secao">
        <h2>Vídeos Educativos</h2>
        <div class="grid">
            <div class="video-box"><iframe src="https://www.youtube.com/embed/n_Etdr7Dbjs"></iframe></div>
            <div class="video-box"><iframe src="https://www.youtube.com/embed/UB1O30fR-EE"></iframe></div>
            <div class="video-box"><iframe src="https://www.youtube.com/embed/pQN-pnXPaVg"></iframe></div>
            <div class="video-box"><iframe src="https://www.youtube.com/embed/S9uPNppGsGo"></iframe></div>
            <div class="video-box"><iframe src="https://www.youtube.com/embed/Ptbk2af68e8"></iframe></div>
            <div class="video-box"><iframe src="https://www.youtube.com/embed/mH0S_R-wD8I"></iframe></div>
        </div>
    </div>

    <script>
        let index = 1;
        let timer;
        const slides = document.querySelectorAll(".slide");

        mostrarSlide(index);

        function mudarSlide(n) {
            clearTimeout(timer); 
            mostrarSlide(index += n);
        }

        function mostrarSlide(n) {
            if (n > slides.length) { index = 1 }
            if (n < 1) { index = slides.length }
            
            // Esconde apenas os slides, os botoes ficam fora desse loop
            slides.forEach(s => s.style.display = "none");
            
            // Mostra o slide atual
            slides[index-1].style.display = "block";
            
            // Passagem automática
            timer = setTimeout(() => {
                mostrarSlide(index += 1);
            }, 5000);
        }
    </script>
</body>
</html>
