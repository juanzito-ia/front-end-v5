<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background-color: transparent; 
            line-height: 1.6;
        }

        .titulo-secao {
            margin: 30px 0 15px 0;
            padding-left: 10px;
            border-left: 5px solid #2ecc71;
            font-size: 24px;
            color: #333;
        }

        /* Grid de Vídeos no Topo */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Container do Slideshow (Abaixo dos vídeos) */
        .slider-container {
            width: 100%;
            max-width: 900px;
            height: 400px;
            margin: 0 auto 50px auto;
            position: relative;
            background-color: #222;
            border-radius: 15px;
            overflow: hidden;
            display: block !important;
        }

        .meu-slide {
            display: none;
            width: 100%;
            height: 100%;
        }

        .meu-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .legenda {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            text-align: center;
        }

        /* Espaçamento extra no final para permitir o scroll */
        .espacador {
            height: 100px;
        }
    </style>
</head>
<body>

    <h2 class="titulo-secao">Galeria de Vídeos</h2>
    
    <div class="video-grid">
        <iframe src="https://www.youtube.com/embed/n_Etdr7Dbjs" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/UB1O30fR-EE" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/pQN-pnXPaVg" allowfullscreen></iframe>
    </div>

    <hr>

    <h2 class="titulo-secao">Destaques em Slide</h2>

    <div class="slider-container">
        <div class="meu-slide" style="display: block;">
            <img src="https://picsum.photos/900/400?random=1">
            <div class="legenda">Destaque 01 - Novidades</div>
        </div>
        <div class="meu-slide">
            <img src="https://picsum.photos/900/400?random=2">
            <div class="legenda">Destaque 02 - Projetos</div>
        </div>
        <div class="meu-slide">
            <img src="https://picsum.photos/900/400?random=3">
            <div class="legenda">Destaque 03 - Comunidade</div>
        </div>
    </div>

    <div class="espacador"></div>

    <script>
        let slideIndex = 0;
        const slides = document.getElementsByClassName("meu-slide");

        function carrossel() {
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            slideIndex++;
            if (slideIndex > slides.length) { slideIndex = 1; }
            
            slides[slideIndex - 1].style.display = "block";
            setTimeout(carrossel, 3000);
        }

        window.onload = carrossel;
    </script>
</body>
</html>
