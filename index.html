<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Site Profissional</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilo para posicionar o contador no canto inferior direito */
        .contador-container {
            position: fixed; /* Mantém fixo na tela */
            bottom: 20px;    /* Distância do fundo */
            right: 20px;     /* Distância da direita */
            background-color: rgba(44, 62, 80, 0.9); /* Fundo escuro semi-transparente */
            color: white;
            padding: 8px 15px;
            border-radius: 30px; /* Bordas arredondadas */
            font-family: Arial, sans-serif;
            font-size: 0.85rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000; /* Garante que fique acima de outros elementos */
            border: 1px solid #34495e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #contador {
            font-weight: bold;
            color: #2ecc71; /* Verde neon para o número */
            font-size: 1rem;
        }

        /* Ajuste para o Dark Mode se necessário */
        .dark .contador-container {
            background-color: rgba(236, 240, 241, 0.9);
            color: #2c3e50;
            border: 1px solid #bdc3c7;
        }
    </style>
</head>
<body>
<div class="container">
    <nav class="menu-lateral">
        <h2>📚 Menu</h2>
        <ul>
            <li><a href="conteudo1.html" target="frameConteudo">🎥 Vídeos</a></li>
            <li><a href="conteudo2.html" target="frameConteudo">🖼️ Imagens</a></li>
            <li><a href="conteudo3.html" target="frameConteudo">📄 Sobre</a></li>
            <li><a href="admin.html" target="frameConteudo">⚙️ Admin</a></li>
        </ul>
        <button onclick="document.body.classList.toggle('dark')">🌙 Dark Mode</button>
        <button onclick="window.location.href='login.html'" style="margin-top:10px; background:#e74c3c; color:white;">🚪 Sair</button>
    </nav>

    <header class="cabecalho">
        <h1>🌐 Painel Mini Site Profissional</h1>
    </header>

    <main class="principal">
        <iframe name="frameConteudo" src="conteudo1.html" style="width: 100%; height: 100%; border: none;"></iframe>
    </main>

    <footer class="rodape">
        <p>© 2026 - Seu Projeto Final</p>
    </footer>

    <div class="contador-container">
        <span>👤 Visitantes:</span>
        <span id="contador">0</span>
    </div>
</div>

<script>
    function atualizarContador() {
        let visitas = localStorage.getItem('contadorVisitas');

        if (visitas) {
            visitas = parseInt(visitas) + 1;
        } else {
            visitas = 1;
        }

        localStorage.setItem('contadorVisitas', visitas);
        document.getElementById('contador').innerText = visitas;
    }

    // Chama a função ao carregar
    window.onload = atualizarContador;
</script>

</body>
</html>
